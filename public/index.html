<!DOCTYPE html>
<html>

<head>
    <title>Simple Chat</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Modal de personalización -->
    <dialog class="avatarDialog" id="avatarDialog">
        <form id="avatarForm" method="dialog">
            <section>
                <p>
                    <label for="avatar">Avatar:</label>
                    <select name="avatar" id="avatar">
                        <option>#️⃣</option>
                        <option>💻</option>
                        <option>😵‍💫</option>
                        <option>🎮</option>
                    </select>
                </p>
                <p>
                    <label for="nombre">Nombre:</label>
                    <select name="nombre" id="nombre">
                        <option>Ragonhh</option>
                        <option>Stylish_IWNL</option>
                        <option>iBlueWolf</option>
                        <option>DeividG04</option>
                    </select>
                </p>
                <p>
                    <label for="color">Color:</label>
                    <select name="color" id="color">
                        <option>purple</option>
                        <option>green</option>
                        <option>blue</option>
                        <option>red</option>
                    </select>
                </p>
            </section>
            <menu>
                <button id="cancel" type="reset">❌</button>
                <button type="submit">✅</button>
            </menu>
        </form>
    </dialog>
    <!-- Pantalla -->
    <div class="screen">
        <!-- Caja de mensajes -->
        <div id="messages-box" class="messages-box">
            <p id="messages" class="messages"></p>
        </div>
    </div>
    <!-- Input para enviar el mensaje -->
    <form id="form" action="" class="form">
        <input id="input" autocomplete="off" /><span id="editBtn" class="sendButton">✏️</span>
    </form>
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>

</html>
