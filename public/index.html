<!DOCTYPE html>
<html>

<head>
    <title>Simple Chat</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Modal de personalización -->
    <dialog class="avatarDialog" id="avatarDialog">
        <form id="avatarForm" method="dialog">
            <section>
                <p>
                    <label for="favAnimal">Favorite animal:</label>
                    <select name="favAnimal" id="favAnimal">
                        <option></option>
                        <option>Brine shrimp</option>
                        <option>Red panda</option>
                        <option>Spider monkey</option>
                    </select>
                </p>
            </section>
            <menu>
                <button id="cancel" type="reset">Cancel</button>
                <button type="submit">Confirm</button>
            </menu>
        </form>
    </dialog>
    <!-- Pantalla -->
    <div class="screen">
        <!-- Caja de mensajes -->
        <div id="messages-box" class="messages-box">
            <p id="messages" class="messages"></p>
        </div>
    </div>
    <!-- Input para enviar el mensaje -->
    <form id="form" action="" class="form">
        <input id="input" autocomplete="off" /><span id="editBtn" class="sendButton">✏️</span>
    </form>
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>

</html>
